# Full nginx configuration (mounted as /etc/nginx/nginx.conf, see docker-compose.yml).
# perf 0.6.2 (5,000 students per school): enough connections, keep-alive that never races
# the API's own timeout, gzip for JSON, and the web app's files cached here so the API
# containers don't serve them again and again at exam start.
worker_processes auto;
worker_rlimit_nofile 65535;
events {
    # Each laptop holds 1-2 connections (page + app); nginx needs one more per request
    # to the API. 16k per worker process is plenty for several schools.
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    access_log off;                       # per-request logs at thousands of req/s: turn on only to debug
    error_log /var/log/nginx/error.log warn;

    # Laptops beat every 5 s: keep their connections open between beats.
    keepalive_timeout 75s;
    keepalive_requests 100000;

    # JSON (attempt view ~8 KB -> ~2 KB, a 100-student live room ~80 KB -> ~8 KB). The web
    # app's own files arrive already compressed from the API (app/static_files.py).
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/json text/css text/javascript application/javascript application/wasm image/svg+xml;

    # The web app's files (hashed /assets/ are immutable; the rest are revalidated by the
    # API's ETags). Cached per Accept-Encoding variant (the API sends Vary).
    proxy_cache_path /var/cache/nginx/fairplay levels=1:2 keys_zone=fairplay_static:10m
                     max_size=2g inactive=7d use_temp_path=off;

    upstream proctora_api {
        server api:8000;          # Docker DNS round-robins across scaled api replicas
        keepalive 512;
        # Shorter than uvicorn's --timeout-keep-alive 75 (Dockerfile): nginx always closes an
        # idle upstream connection first, so a request never lands on one the API just closed
        # (that race shows up as rare 502s on POSTs, which nginx must not retry).
        keepalive_timeout 60s;
        keepalive_requests 100000;
    }
    # Plain HTTP on :80 is for a box behind a TLS-terminating load balancer only. Exposed
    # directly, add a `listen 443 ssl;` server with ssl_certificate / ssl_certificate_key and
    # make this one `return 301 https://$host$request_uri;` (audit 2026-10-13).
    server {
        listen 80 backlog=4096;
        # Audit S-11: limits per kind of request, matching the API's own (app/http_guard.py).
        client_max_body_size 10m;            # answers, exams, everything else
        # An answer save carries the whole answer map (essays: tens of KB). Keep such bodies in
        # memory instead of a temporary file per request (the default buffer is 8-16 KB).
        client_body_buffer_size 256k;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append): the API trusts this header for per-IP sign-in limits,
        # so a client must not be able to supply its own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~ ^/api/exams/[^/]+/scans$ {
            client_max_body_size 250m;       # scanned papers (API limit 200 MB)
            proxy_request_buffering off;     # stream to the API instead of filling nginx's disk
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://proctora_api;
        }
        location = /api/uploads {
            client_max_body_size 10m;        # question images (API limit 5 MB)
            proxy_pass http://proctora_api;
        }
        location ~ ^/api/student/exams/[^/]+/materials$ {
            client_max_body_size 21m;        # 2026-10-23 (review 2): open-book files (API limit 20 MB per student + 64 KB multipart overhead)
            proxy_request_buffering off;
            proxy_pass http://proctora_api;
        }
        location /api/ {
            proxy_pass http://proctora_api;
        }
        # perf 0.6.2: the web app's files from nginx's cache (the API's Cache-Control decides
        # how long; one request per file per variant reaches the API).
        location ~ ^/(assets|app-assets|pyodide|pdfjs)/ {
            proxy_cache fairplay_static;
            proxy_cache_key $scheme$proxy_host$uri;
            proxy_cache_lock on;                         # 5,000 laptops, one fetch from the API
            proxy_cache_use_stale updating error timeout;
            proxy_cache_revalidate on;
            add_header X-Cache $upstream_cache_status;
            proxy_pass http://proctora_api;
        }
        location / {
            proxy_pass http://proctora_api;
        }
    }
}
# TLS (audit S-17): terminate HTTPS here or in front of this proxy, e.g.
#   listen 443 ssl http2; ssl_certificate /etc/ssl/fairplay/fullchain.pem;
#   ssl_certificate_key /etc/ssl/fairplay/privkey.pem;
# and redirect port 80 to https. The API then sends HSTS (it sees X-Forwarded-Proto https).
