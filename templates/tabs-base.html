{% macro make_tab(name, fa, url, text, extra_class='') %}
    <li class="tab{% if tab == name %} active{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}">
        {%- if url %}<a href="{{ url }}">{% else %}<span>{% endif -%}
        <i class="tab-icon fa {{ fa }}"></i> {{ text }}
        {%- if url %}</a>{% else %}</span>{% endif -%}
    </li>
{% endmacro %}

<div class="tabs">
    <h2>{{ content_title or title }}</h2>
    {% block post_tab_spacer %}{% endblock %}
    <ul>
        {% block tabs %}{% endblock %}
    </ul>
</div>
