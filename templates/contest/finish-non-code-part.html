{% if part_lock and part_lock.can_finish %}
    <form action="{{ url('contest_finish_non_code_part', contest.key) }}" method="post"
          class="finish-non-code-part-form"
          data-confirm="{{ part_lock.finish_confirm or _('Once you continue, you cannot return to this part. Continue?') }}">
        {% csrf_token %}
        <button type="submit" class="{{ button_class|default('button') }}">
            <i class="fa fa-arrow-right"></i> {{ _('Finish this part') }}
        </button>
    </form>
    <script>
        (function () {
            document.querySelectorAll('.finish-non-code-part-form').forEach(function (form) {
                if (form.dataset.bound) return;
                form.dataset.bound = '1';
                form.addEventListener('submit', function (event) {
                    var message = form.getAttribute('data-confirm');
                    if (message && !window.confirm(message)) event.preventDefault();
                });
            });
        })();
    </script>
{% endif %}
