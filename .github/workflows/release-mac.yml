name: release-mac

# Tag vX.Y.Z -> universal (Apple Silicon + Intel) release build of the Mac app pointed at the
# exam server, attached to the GitHub release of that tag as FairPlay-Mac.zip.
#
# Needs the repository secret FAIRPLAY_APP_KEY (same value as the server's FAIRPLAY_APP_KEY).
# Not Developer ID signed yet (ad-hoc): students use "Open Anyway" once (see RELEASES.md).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Changing RELEASE_VERSION on a branch releases v<that version> (the tag is created here).
    paths: ["RELEASE_VERSION"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FAIRPLAY_BUILD: release
  FAIRPLAY_SERVER: https://exam.speakupai.uz
  # SHA-256 of the root CAs Render (and any Let's Encrypt server) chains to:
  # ISRG Root X1, ISRG Root X2, GTS Root R1, GTS Root R3, GTS Root R4.
  FAIRPLAY_PINS: "lrzsBiZJdvN0YHeazyjFp8/oo8Cq4RqP/O4FwL3fCMY=,aXKbjhWobvwXelevtxcd/GSt0owvyozxUH40RTzLFHA=,2UdDKr3nt/qQ/C5rWRAbEoDg4cfk5A+jxoh//1en9M8=,NNinPuII2bzbDZVlIJNLTkDmlIJZbotvc8hCawEKb0g=,NJ36QFjF4mMSOzmK55VXPE4TE8g/5o+TVWzV6AMbPH0="

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(tr -d ' \n' < RELEASE_VERSION)"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # 2026-10-22: a fixed signing certificate keeps macOS' Accessibility permission across
      # updates (ad-hoc signatures change with every build). Secrets MAC_SIGN_P12 (base64
      # of the .p12) and MAC_SIGN_PASSWORD; without them the build is ad-hoc signed.
      # Developer ID + notarization (like VoiceLab): macOS then opens FairPlay without the
      # "Apple could not verify ... free of malware" box. Needs an Apple Developer Program
      # membership. Secrets (all six; until then this step is skipped):
      #   APPLE_CERTIFICATE_BASE64   base64 of the "Developer ID Application" .p12
      #   APPLE_CERTIFICATE_PASSWORD password of that .p12
      #   APPLE_API_KEY_BASE64       base64 of the App Store Connect API key (.p8)
      #   APPLE_API_KEY_ID, APPLE_API_ISSUER   from App Store Connect > Users and Access > Integrations
      #   APPLE_TEAM_ID              10-character team id
      - name: Developer ID certificate (notarized builds)
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for n in CERT CERT_PASSWORD API_KEY API_KEY_ID API_ISSUER TEAM_ID; do [ -n "${!n}" ] || missing="$missing $n"; done
          if [ -n "$missing" ]; then
            echo "::warning::No Developer ID secrets (missing:$missing): macOS will warn students when they open FairPlay"
            exit 0
          fi
          KC="$RUNNER_TEMP/devid.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$ID" ] || { echo "::error::No 'Developer ID Application' identity in APPLE_CERTIFICATE_BASE64"; exit 1; }
          echo "$ID" | grep -q "($TEAM_ID)" || { echo "::error::Certificate team does not match APPLE_TEAM_ID"; exit 1; }
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials fairplay-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --keychain "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/notary.p8"
          {
            echo "FAIRPLAY_SIGN_ID=$ID"
            echo "FAIRPLAY_NOTARY_PROFILE=fairplay-notary"
            echo "NOTARY_KEYCHAIN=$KC"
          } >> "$GITHUB_ENV"
          echo "::notice::Signing with $ID and notarizing"

      - name: Signing certificate
        if: env.FAIRPLAY_SIGN_ID == ''
        env:
          P12: ${{ secrets.MAC_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "::warning::MAC_SIGN_P12 not set: ad-hoc signing"; exit 0; fi
          KC="$RUNNER_TEMP/fp.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/fp.p12"
          security import "$RUNNER_TEMP/fp.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Self-signed: trust it for code signing on this runner only (codesign wants a valid identity).
          openssl pkcs12 -in "$RUNNER_TEMP/fp.p12" -nokeys -passin env:P12_PASSWORD -legacy -out "$RUNNER_TEMP/fp.pem" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/fp.p12" -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/fp.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/fp.pem"
          rm -f "$RUNNER_TEMP/fp.p12" "$RUNNER_TEMP/fp.pem"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"
          echo "FAIRPLAY_SIGN_SELF=FairPlay Code Signing" >> "$GITHUB_ENV"

      - name: Build (release, universal)
        env:
          FAIRPLAY_APP_KEY: ${{ secrets.FAIRPLAY_APP_KEY }}
        run: |
          if [ ${#FAIRPLAY_APP_KEY} -lt 32 ]; then
            echo "::error::Set the repository secret FAIRPLAY_APP_KEY (same value as the server)"; exit 1
          fi
          xcodebuild -version
          bash mac/build.sh
          lipo -info mac/FairPlay.app/Contents/MacOS/Proctora
          lipo -info mac/FairPlay.app/Contents/MacOS/Proctora | grep -q arm64
          lipo -info mac/FairPlay.app/Contents/MacOS/Proctora | grep -q x86_64
          codesign --verify --deep --strict mac/FairPlay.app
          codesign -dr - mac/FairPlay.app 2>&1 | tail -1    # designated requirement (TCC uses it)
          plutil -extract ServerURL raw mac/FairPlay.app/Contents/Resources/FairPlayBuild.plist

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent mac/FairPlay.app FairPlay-Mac.zip

      # Disk image like most Mac apps: open it, drag FairPlay onto Applications.
      - name: Disk image
        run: |
          D="$RUNNER_TEMP/dmg"; rm -rf "$D"; mkdir -p "$D"
          ditto mac/FairPlay.app "$D/FairPlay.app"
          ln -s /Applications "$D/Applications"
          hdiutil create -volname FairPlay -srcfolder "$D" -fs HFS+ -format UDZO -ov FairPlay-Mac.dmg
          if [ -n "${FAIRPLAY_SIGN_ID:-}" ]; then
            codesign --force --timestamp --sign "$FAIRPLAY_SIGN_ID" FairPlay-Mac.dmg
            out="$(xcrun notarytool submit FairPlay-Mac.dmg --keychain-profile fairplay-notary --keychain "$NOTARY_KEYCHAIN" --wait 2>&1)"
            echo "$out"
            echo "$out" | grep -q "status: Accepted" || { echo "::error::Notarization of the disk image was not accepted"; exit 1; }
            xcrun stapler staple FairPlay-Mac.dmg
            spctl -a -t open --context context:primary-signature -v FairPlay-Mac.dmg
          fi
          hdiutil verify FairPlay-Mac.dmg

      # The code repo is private; students download from the public khamidov17/fairplay-download.
      # Needs the secret PUBLIC_RELEASE_TOKEN (fine-grained, Contents read/write on fairplay-download).
      - name: Publish to fairplay-download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::PUBLIC_RELEASE_TOKEN not set: students can't download this version"; exit 1; fi
          R=khamidov17/fairplay-download
          sed 's#khamidov17/fairplay/releases#khamidov17/fairplay-download/releases#g' RELEASES.md > notes.md
          if ! gh release view "$TAG" -R $R >/dev/null 2>&1; then
            if ! out=$(gh release create "$TAG" -R $R --title "FairPlay $TAG" --notes-file notes.md 2>&1); then
              gh release view "$TAG" -R $R >/dev/null 2>&1 || {   # not created meanwhile by another workflow
                echo "$out"; echo "::error::Creating release $TAG on $R failed: $(echo "$out" | tr '\n' ' ' | cut -c1-300)"
                echo "::error::PUBLIC_RELEASE_TOKEN needs Repository access to khamidov17/fairplay-download with Contents read and write"
                exit 1; }
            fi
          fi
          if ! out=$(gh release upload "$TAG" -R $R FairPlay-Mac.dmg FairPlay-Mac.zip --clobber 2>&1); then
            echo "$out"; echo "::error::Upload to $R failed: $(echo "$out" | tr '\n' ' ' | cut -c1-300)"; exit 1
          fi

      - name: Keep the zip (manual runs)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: FairPlay-Mac
          path: |
            FairPlay-Mac.dmg
            FairPlay-Mac.zip
          retention-days: 14
